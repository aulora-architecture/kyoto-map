<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>京都 建築巡りマップ | aulora</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #111111;
      color: #111111;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    }
    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
    }

    /* スマホ：上部に地図（基本は広め）、下部にシート */
    #map-stage {
      position: relative;
      width: 100%;
      height: 62%;
      min-height: 220px;
      flex-shrink: 0;
      transition: height 0.22s ease;
      background: #1a1a1a;
    }
    #map-stage.expanded-map {
      height: calc(100% - 50px);
    }
    #map {
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    #bottom-sheet {
      position: relative;
      flex: 1;
      min-height: 50px;
      background: #ffffff;
      border-top: 1px solid #d4d4d4;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 10;
    }
    #sheet-handle-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      background: #fafafa;
      border-bottom: 1px solid #e5e5e5;
      cursor: pointer;
      user-select: none;
      flex-shrink: 0;
    }
    .handle-pill {
      width: 34px;
      height: 4px;
      border-radius: 999px;
      background: #a3a3a3;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }
    #sheet-content {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px 24px;
      background: #ffffff;
    }

    /* PC（md以上）：左にパネル、右に地図 */
    @media (min-width: 768px) {
      #app {
        flex-direction: row;
      }
      #bottom-sheet {
        order: 1;
        width: 400px;
        max-width: 44vw;
        height: 100%;
        flex: none;
        border-top: none;
        border-right: 1px solid #d4d4d4;
      }
      #map-stage {
        order: 2;
        flex: 1;
        width: auto;
        height: 100% !important;
      }
      #sheet-handle-bar {
        display: none;
      }
    }

    /* モノトーンのマーカー */
    .spot-marker {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 999px;
      background: #111111;
      color: #ffffff;
      font-size: 10px;
      font-weight: 700;
      border: 2px solid #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.55);
      transition: transform 0.15s ease, background-color 0.15s ease, color 0.15s ease;
    }
    .spot-marker.active {
      background: #ffffff;
      color: #111111;
      border: 2.5px solid #111111;
      transform: scale(1.25);
      z-index: 999 !important;
    }

    /* Leaflet コントロールをモノトーンに統一 */
    .leaflet-control-attribution {
      font-size: 10px !important;
      background: rgba(255, 255, 255, 0.88) !important;
      color: #262626 !important;
    }
    .leaflet-control-attribution a {
      color: #111111 !important;
      text-decoration: underline;
    }
    .leaflet-bar a {
      background-color: #ffffff !important;
      color: #111111 !important;
      border-color: #d4d4d4 !important;
    }
    .leaflet-bar a:hover {
      background-color: #f5f5f5 !important;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- 地図エリア -->
    <div id="map-stage" class="expanded-map">
      <div id="map"></div>

      <!-- 地図右上のコンパクト操作 -->
      <div class="absolute top-2.5 right-2.5 z-[400] flex flex-col gap-1.5 items-end">
        <select id="layer-select" aria-label="地図の種類"
          class="bg-white/95 text-neutral-900 text-xs font-medium border border-neutral-400 rounded-md px-2.5 py-1.5 shadow-sm backdrop-blur focus:outline-none">
          <option value="photo" selected>航空写真</option>
          <option value="std">標準地図</option>
          <option value="pale">淡色地図</option>
        </select>
        <button id="btn-fit-all" type="button"
          class="bg-white/95 hover:bg-neutral-100 text-neutral-900 text-xs font-medium border border-neutral-400 rounded-md px-2.5 py-1.5 shadow-sm backdrop-blur">
          全体表示
        </button>
      </div>
    </div>

    <!-- 下部シート（スマホ）／左パネル（PC） -->
    <div id="bottom-sheet">
      <div id="sheet-handle-bar" title="タップでシートを開閉">
        <span id="sheet-status-label" class="text-xs font-medium text-neutral-800 truncate max-w-[55%]">京都 建築巡り（全92件）</span>
        <div class="handle-pill"></div>
        <button id="btn-toggle-sheet" type="button" class="text-xs text-neutral-900 font-semibold underline underline-offset-2">
          シートを開く
        </button>
      </div>

      <!-- タブバー -->
      <div class="flex border-b border-neutral-200 bg-neutral-50 shrink-0">
        <button data-tab="list" class="tab-btn flex-1 py-2.5 text-xs font-bold text-neutral-900 border-b-2 border-neutral-900">
          探す (<span id="count-badge">92</span>)
        </button>
        <button data-tab="detail" class="tab-btn flex-1 py-2.5 text-xs font-semibold text-neutral-400 border-b-2 border-transparent">
          詳細
        </button>
        <button data-tab="route" class="tab-btn flex-1 py-2.5 text-xs font-semibold text-neutral-400 border-b-2 border-transparent">
          2地点ルート
        </button>
      </div>

      <!-- タブ中身 -->
      <div id="sheet-content">
        <!-- 1. 探すタブ -->
        <div id="tab-list" class="space-y-2.5">
          <div class="space-y-1.5">
            <input id="search-input" type="text" placeholder="建築名・設計者・エリアで検索"
              class="w-full bg-neutral-50 border border-neutral-300 rounded-md px-3 py-1.5 text-xs text-neutral-900 placeholder-neutral-400 focus:outline-none focus:border-neutral-900" />
            <div class="flex gap-1.5">
              <select id="series-filter" aria-label="シリーズ絞り込み"
                class="flex-1 bg-neutral-50 border border-neutral-300 rounded-md px-2 py-1.5 text-xs text-neutral-900 focus:outline-none focus:border-neutral-900">
                <option value="all">京都編 すべて</option>
                <option value="京都編1">京都編1（洛北・15）</option>
                <option value="京都編2">京都編2（北白川〜岡崎・10）</option>
                <option value="京都編3">京都編3（南禅寺〜山科・12）</option>
                <option value="京都編4">京都編4（東山区・18）</option>
                <option value="京都編5">京都編5（中京区・16）</option>
                <option value="京都編6">京都編6（北・右京・西京・南・下京・21）</option>
              </select>
              <select id="sort-select" aria-label="並び替え"
                class="flex-1 bg-neutral-50 border border-neutral-300 rounded-md px-2 py-1.5 text-xs text-neutral-900 focus:outline-none focus:border-neutral-900">
                <option value="default">記事順（1〜92）</option>
                <option value="year-asc">年代順（古い順）</option>
                <option value="year-desc">年代順（新しい順）</option>
              </select>
            </div>
          </div>
          <div id="spot-list" class="space-y-1.5"></div>
        </div>

        <!-- 2. 詳細タブ -->
        <div id="tab-detail" class="hidden space-y-3">
          <div id="detail-empty" class="text-xs text-neutral-500 py-8 text-center">
            地図上のピンまたは「探す」から建築を選ぶと詳細が表示されます。
          </div>
          <div id="detail-body" class="hidden space-y-3">
            <div class="flex items-start justify-between gap-2">
              <div>
                <span id="detail-series" class="inline-block text-[10px] font-medium px-2 py-0.5 rounded bg-neutral-900 text-white mb-1.5"></span>
                <h2 id="detail-name" class="text-base font-bold text-neutral-900 leading-snug"></h2>
                <p id="detail-meta" class="text-xs text-neutral-600 mt-1 leading-relaxed"></p>
              </div>
              <button id="btn-close-detail" type="button"
                class="text-xs px-2.5 py-1 rounded bg-neutral-100 hover:bg-neutral-200 text-neutral-800 border border-neutral-300 shrink-0">
                閉じる
              </button>
            </div>

            <!-- 写真表示エリア（1〜2枚・設定時のみ表示） -->
            <div id="detail-photos" class="hidden"></div>

            <!-- ひとことメモ -->
            <p id="detail-memo" class="text-xs text-neutral-700 leading-relaxed bg-neutral-50 p-3 rounded-md border border-neutral-200"></p>

            <!-- 同じ設計者の作品（竣工年順） -->
            <div id="same-architect-box" class="hidden pt-3 border-t border-neutral-200 space-y-2">
              <div id="same-architect-list" class="space-y-2.5"></div>
            </div>
          </div>
        </div>

        <!-- 3. 2地点ルートタブ -->
        <div id="tab-route" class="hidden space-y-2.5">
          <div>
            <label class="block text-[11px] font-medium text-neutral-600 mb-1">出発地</label>
            <select id="route-from" class="w-full bg-neutral-50 border border-neutral-300 rounded-md px-2.5 py-1.5 text-xs text-neutral-900"></select>
          </div>
          <div>
            <label class="block text-[11px] font-medium text-neutral-600 mb-1">目的地</label>
            <select id="route-to" class="w-full bg-neutral-50 border border-neutral-300 rounded-md px-2.5 py-1.5 text-xs text-neutral-900"></select>
          </div>
          <div class="flex gap-2">
            <button id="btn-calc-route" type="button"
              class="flex-1 bg-neutral-900 hover:bg-neutral-800 text-white text-xs font-semibold py-2 rounded-md">
              直線距離・ライン表示
            </button>
            <button id="btn-clear-route" type="button"
              class="px-3 bg-neutral-100 hover:bg-neutral-200 text-neutral-800 text-xs rounded-md border border-neutral-300">
              消去
            </button>
          </div>
          <div id="route-result" class="text-xs text-neutral-800 bg-neutral-50 p-3 rounded-md border border-neutral-200 hidden"></div>
        </div>
      </div>
    </div>
  </div>

      { id: 81, series: "京都編6", orderInSeries: "10", name: "HOTEL SHE, KYOTO", architect: "AT.O.DE／プロデュース：龍崎翔子", architectKeys: ["AT.O.DE"], year: 2019, yearLabel: "2019年リニューアル", area: "南区", lat: 34.9794, lng: 135.7590, memo: "あえて京都らしさを使わずアメリカのモーテルをオマージュ。ロードサイド立地を活かした色彩設計。", photos: [] },
      { id: 82, series: "京都編6", orderInSeries: "11", name: "東華菜館 本店", architect: "ウィリアム・メレル・ヴォーリズ", architectKeys: ["ウィリアム・メレル・ヴォーリズ"], year: 1926, yearLabel: "1926年竣工", area: "下京区", lat: 35.0034, lng: 135.7709, memo: "四条大橋たもとのスパニッシュ様式洋館。日本最古の手動式EVやテラコッタ装飾、そして絶品の春巻き。", photos: [] },
      { id: 83, series: "京都編6", orderInSeries: "12", name: "Apple 京都", architect: "Foster + Partners", architectKeys: ["Foster + Partners"], year: 2018, yearLabel: "2018年竣工", area: "下京区", lat: 35.0039, lng: 135.7647, memo: "四条通に面する行灯のようなファサード。障子や提灯の意匠とグローバルブランドが美しく着地。", photos: [] },
      { id: 84, series: "京都編6", orderInSeries: "13", name: "sequence KYOTO GOJO", architect: "日建設計・乃村工藝社 など", architectKeys: ["日建設計", "乃村工藝社"], year: 2020, yearLabel: "2020年竣工", area: "下京区", lat: 34.9977, lng: 135.7598, memo: "五条通沿いのライフスタイルホテル。しっかり熱く負担の少ないミストサウナとシャワーが最高峰。", photos: [] },
      { id: 85, series: "京都編6", orderInSeries: "14", name: "hotel tou nishinotoin kyoto", architect: "SUPPOSE DESIGN OFFICE", architectKeys: ["SUPPOSE DESIGN OFFICE"], year: 2021, yearLabel: "2021年竣工", area: "下京区", lat: 34.9935, lng: 135.7547, memo: "渋い銅板のアプローチと黒ベースの陰影深い館内。景色が抜けない弱点を障子の光拡散で逆手に取る。", photos: [] },
      { id: 86, series: "京都編6", orderInSeries: "15", name: "メルキュール京都ステーション", architect: "東洋設計事務所／内装：DESIGN STUDIO CROW", architectKeys: ["東洋設計事務所", "DESIGN STUDIO CROW"], year: 2020, yearLabel: "2020年竣工", area: "下京区", lat: 34.9888, lng: 135.7519, memo: "「平安京・貴族の遊び」を現代的に解釈したやり切り型の和モダン・ストーリー空間。", photos: [] },
      { id: 87, series: "京都編6", orderInSeries: "16", name: "渉成園 (枳殻邸)", architect: "作庭：石川丈山", architectKeys: ["石川丈山"], year: 1653, yearLabel: "1653年作庭", area: "下京区", lat: 34.9912, lng: 135.7623, memo: "東本願寺の飛地境内地にある回遊式庭園。時代を経て色濃くなった木部の渋さが時間の堆積を感じさせる。", photos: [] },
      { id: 88, series: "京都編6", orderInSeries: "17", name: "東本願寺参拝接待所", architect: "高松伸", architectKeys: ["高松伸"], year: 1998, yearLabel: "1998年竣工", area: "下京区", lat: 34.9912, lng: 135.7591, memo: "御影堂の足元に埋まるモダンかつ神聖な地下空間。三角錐台のホールと天窓の光溜まりがロマン溢れる。", photos: [] },
      { id: 89, series: "京都編6", orderInSeries: "18", name: "Kaikado Café", architect: "Thomas Lykke（OEO Studio）", architectKeys: ["Thomas Lykke"], year: 2016, yearLabel: "2016年竣工", area: "下京区", lat: 34.9907, lng: 135.7652, memo: "市電の旧内浜架線詰所（登録有形文化財）を改修。レトロな面影と無垢材家具が心地よく調和。", photos: [] },
      { id: 90, series: "京都編6", orderInSeries: "19", name: "京都市立芸術大学", architect: "乾・RING・フジワラボ・o＋h・吉村設計共同体", architectKeys: ["乾久美子", "RING", "フジワラボ", "o＋h", "吉村靖孝"], year: 2023, yearLabel: "2023年移転竣工", area: "下京区", lat: 34.9869, lng: 135.7647, memo: "京都駅東・崇仁地域へ移転した街に開かれたキャンパス。分棟配置と都市の玄関口としての在り方を問う。", photos: [] },
      { id: 91, series: "京都編6", orderInSeries: "20", name: "京都市水族館", architect: "東洋設計事務所 / 大成建設", architectKeys: ["東洋設計事務所", "大成建設"], year: 2012, yearLabel: "2012年竣工", area: "下京区", lat: 34.9875, lng: 135.7478, memo: "梅小路公園内に建つ内陸型水族館。京都の川や海の展示、イルカショーで癒されるスポット。", photos: [] },
      { id: 92, series: "京都編6", orderInSeries: "21", name: "京都駅", architect: "原広司", architectKeys: ["原広司"], year: 1997, yearLabel: "1997年竣工", area: "下京区", lat: 34.9858, lng: 135.7588, memo: "長さ470m・高さ60mの4000枚のガラス屋根に覆われた現代の巨大な谷。質量の暴力と美しさが同居。", photos: [] }
    ];

    // 地図レイヤー（初期設定：航空写真）
    const layers = {
      photo: L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg", {
        maxZoom: 18,
        attribution: "<a href='https://maps.gsi.go.jp/development/ichiran.html' target='_blank' rel='noopener'>国土地理院</a>"
      }),
      std: L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png", {
        maxZoom: 18,
        attribution: "<a href='https://maps.gsi.go.jp/development/ichiran.html' target='_blank' rel='noopener'>国土地理院</a>"
      }),
      pale: L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png", {
        maxZoom: 18,
        attribution: "<a href='https://maps.gsi.go.jp/development/ichiran.html' target='_blank' rel='noopener'>国土地理院</a>"
      })
    };

    const map = L.map("map", {
      center: [35.0116, 135.7681],
      zoom: 12,
      layers: [layers.photo],
      zoomControl: true
    });

    const markersById = new Map();
    let activeSpotId = null;
    let routeLine = null;

    // マーカー生成
    SPOTS.forEach((spot) => {
      const icon = L.divIcon({
        className: "custom-div-icon",
        html: `<div id="marker-${spot.id}" class="spot-marker">${spot.id}</div>`,
        iconSize: [26, 26],
        iconAnchor: [13, 13]
      });
      const marker = L.marker([spot.lat, spot.lng], { icon }).addTo(map);
      marker.on("click", () => selectSpot(spot.id, { openSheet: true, flyTo: false }));
      markersById.set(spot.id, marker);
    });

    // スマホ用シート開閉（初期状態は地図が広い）
    const mapStage = document.getElementById("map-stage");
    const btnToggleSheet = document.getElementById("btn-toggle-sheet");
    const sheetHandleBar = document.getElementById("sheet-handle-bar");
    const sheetStatusLabel = document.getElementById("sheet-status-label");

    function setMapExpanded(expanded) {
      if (expanded) {
        mapStage.classList.add("expanded-map");
        btnToggleSheet.textContent = "シートを開く";
      } else {
        mapStage.classList.remove("expanded-map");
        btnToggleSheet.textContent = "地図を広く";
      }
      setTimeout(() => map.invalidateSize(), 240);
    }

    sheetHandleBar.addEventListener("click", () => {
      setMapExpanded(!mapStage.classList.contains("expanded-map"));
    });

    // タブ切替
    const tabBtns = document.querySelectorAll(".tab-btn");
    const tabPanels = {
      list: document.getElementById("tab-list"),
      detail: document.getElementById("tab-detail"),
      route: document.getElementById("tab-route")
    };

    function switchTab(tabName) {
      tabBtns.forEach((btn) => {
        const isTarget = btn.dataset.tab === tabName;
        btn.classList.toggle("text-neutral-900", isTarget);
        btn.classList.toggle("font-bold", isTarget);
        btn.classList.toggle("border-neutral-900", isTarget);
        btn.classList.toggle("text-neutral-400", !isTarget);
        btn.classList.toggle("font-semibold", !isTarget);
        btn.classList.toggle("border-transparent", !isTarget);
      });
      Object.entries(tabPanels).forEach(([key, panel]) => {
        panel.classList.toggle("hidden", key !== tabName);
      });
    }

    tabBtns.forEach((btn) => {
      btn.addEventListener("click", () => {
        setMapExpanded(false);
        switchTab(btn.dataset.tab);
      });
    });

    // 検索・フィルタ・年代順ソート
    const searchInput = document.getElementById("search-input");
    const seriesFilter = document.getElementById("series-filter");
    const sortSelect = document.getElementById("sort-select");
    const spotListEl = document.getElementById("spot-list");
    const countBadge = document.getElementById("count-badge");

    function renderList() {
      const q = searchInput.value.trim().toLowerCase();
      const ser = seriesFilter.value;
      const sortMode = sortSelect.value;

      let filtered = SPOTS.filter((s) => {
        const matchSeries = ser === "all" || s.series === ser;
        const matchQuery =
          !q ||
          s.name.toLowerCase().includes(q) ||
          s.architect.toLowerCase().includes(q) ||
          s.area.toLowerCase().includes(q) ||
          s.yearLabel.toLowerCase().includes(q) ||
          String(s.id).includes(q);
        return matchSeries && matchQuery;
      });

      // 並び替え（年代不明は常に末尾）
      if (sortMode === "year-asc") {
        filtered = [...filtered].sort((a, b) => {
          if (a.year === null && b.year === null) return a.id - b.id;
          if (a.year === null) return 1;
          if (b.year === null) return -1;
          return a.year - b.year || a.id - b.id;
        });
      } else if (sortMode === "year-desc") {
        filtered = [...filtered].sort((a, b) => {
          if (a.year === null && b.year === null) return a.id - b.id;
          if (a.year === null) return 1;
          if (b.year === null) return -1;
          return b.year - a.year || a.id - b.id;
        });
      }

      // 地図上のマーカーも絞り込みに連動
      const visibleIds = new Set(filtered.map((s) => s.id));
      SPOTS.forEach((s) => {
        const m = markersById.get(s.id);
        if (!m) return;
        const shouldShow = visibleIds.has(s.id);
        if (shouldShow && !map.hasLayer(m)) m.addTo(map);
        if (!shouldShow && map.hasLayer(m)) map.removeLayer(m);
      });

      countBadge.textContent = filtered.length;
      spotListEl.innerHTML = "";

      filtered.forEach((s) => {
        const item = document.createElement("button");
        item.type = "button";
        const isActive = s.id === activeSpotId;
        item.className =
          "w-full text-left px-3 py-2 rounded-md border transition flex items-center justify-between gap-2 " +
          (isActive
            ? "bg-neutral-900 border-neutral-900 text-white"
            : "bg-white hover:bg-neutral-50 border-neutral-200 text-neutral-900");
        item.innerHTML = `
          <div class="min-w-0">
            <div class="text-xs font-bold truncate">${s.id}. ${s.name}</div>
            <div class="text-[11px] ${isActive ? "text-neutral-300" : "text-neutral-500"} truncate mt-0.5">
              ${s.yearLabel} · ${s.architect}
            </div>
          </div>
          <div class="text-right shrink-0">
            <div class="text-[10px] font-medium ${isActive ? "text-neutral-300" : "text-neutral-500"}">${s.series}</div>
            <div class="text-[10px] ${isActive ? "text-neutral-400" : "text-neutral-400"}">${s.area}</div>
          </div>
        `;
        item.addEventListener("click", () => {
          selectSpot(s.id, { openSheet: true, flyTo: true });
        });
        spotListEl.appendChild(item);
      });
    }

    // 詳細表示＆同じ設計者の作品（竣工年順）
    const detailEmpty = document.getElementById("detail-empty");
    const detailBody = document.getElementById("detail-body");
    const detailSeries = document.getElementById("detail-series");
    const detailName = document.getElementById("detail-name");
    const detailMeta = document.getElementById("detail-meta");
    const detailPhotos = document.getElementById("detail-photos");
    const detailMemo = document.getElementById("detail-memo");
    const sameArchitectBox = document.getElementById("same-architect-box");
    const sameArchitectList = document.getElementById("same-architect-list");

    function selectSpot(id, { openSheet = true, flyTo = true } = {}) {
      const spot = SPOTS.find((s) => s.id === id);
      if (!spot) return;

      if (activeSpotId !== null) {
        const prevEl = document.getElementById(`marker-${activeSpotId}`);
        if (prevEl) prevEl.classList.remove("active");
      }
      activeSpotId = spot.id;
      const currEl = document.getElementById(`marker-${spot.id}`);
      if (currEl) currEl.classList.add("active");

      sheetStatusLabel.textContent = `${spot.id}. ${spot.name}`;

      if (flyTo) {
        map.setView([spot.lat, spot.lng], Math.max(map.getZoom(), 14), { animate: true });
      }

      detailEmpty.classList.add("hidden");
      detailBody.classList.remove("hidden");
      detailSeries.textContent = `${spot.series}（${spot.orderInSeries}） · #${spot.id}`;
      detailName.textContent = spot.name;
      detailMeta.textContent = `設計・造営：${spot.architect} ／ ${spot.yearLabel} ／ ${spot.area}`;
      detailMemo.textContent = spot.memo || "";

      // 写真（1〜2枚、指定がある場合のみ表示）
      detailPhotos.innerHTML = "";
      const validPhotos = Array.isArray(spot.photos) ? spot.photos.filter(Boolean).slice(0, 2) : [];
      if (validPhotos.length > 0) {
        detailPhotos.classList.remove("hidden");
        detailPhotos.className = validPhotos.length === 1 ? "grid grid-cols-1 gap-2" : "grid grid-cols-2 gap-2";
        validPhotos.forEach((src) => {
          const img = document.createElement("img");
          img.src = src;
          img.alt = spot.name;
          img.loading = "lazy";
          img.className = "w-full h-36 object-cover rounded-md border border-neutral-200 bg-neutral-100";
          img.onerror = () => img.remove();
          detailPhotos.appendChild(img);
        });
      } else {
        detailPhotos.classList.add("hidden");
      }

      // 同じ設計者の作品（複数キーがある場合は設計者ごとにグルーピングして竣工年順に表示）
      sameArchitectList.innerHTML = "";
      const keys = Array.isArray(spot.architectKeys) ? spot.architectKeys : [];
      let hasAnyGroup = false;

      keys.forEach((archKey) => {
        const works = SPOTS
          .filter((s) => Array.isArray(s.architectKeys) && s.architectKeys.includes(archKey))
          .sort((a, b) => (a.year ?? 9999) - (b.year ?? 9999) || a.id - b.id);

        if (works.length > 1) {
          hasAnyGroup = true;
          const groupWrap = document.createElement("div");
          groupWrap.className = "space-y-1";

          const heading = document.createElement("h3");
          heading.className = "text-xs font-bold text-neutral-900";
          heading.textContent = `同じ設計者の作品（${archKey}・竣工年順）`;
          groupWrap.appendChild(heading);

          works.forEach((w) => {
            const btn = document.createElement("button");
            btn.type = "button";
            const isCurrent = w.id === spot.id;
            btn.className =
              "w-full text-left px-2.5 py-1.5 rounded-md text-xs flex items-center justify-between border transition " +
              (isCurrent
                ? "bg-neutral-900 border-neutral-900 text-white font-semibold"
                : "bg-neutral-50 hover:bg-neutral-100 border-neutral-200 text-neutral-800");
            btn.innerHTML = `
              <span class="truncate">${w.id}. ${w.name}</span>
              <span class="text-[11px] ${isCurrent ? "text-neutral-300" : "text-neutral-500"} shrink-0 ml-2">${w.year ? w.year + "年" : "—"}</span>
            `;
            btn.addEventListener("click", () => {
              selectSpot(w.id, { openSheet: true, flyTo: true });
            });
            groupWrap.appendChild(btn);
          });

          sameArchitectList.appendChild(groupWrap);
        }
      });

      sameArchitectBox.classList.toggle("hidden", !hasAnyGroup);

      if (openSheet) {
        setMapExpanded(false);
        switchTab("detail");
      }
      renderList();
    }

    document.getElementById("btn-close-detail").addEventListener("click", () => {
      switchTab("list");
      setMapExpanded(true);
    });

    // 地図レイヤー切替＆全体表示
    const layerSelect = document.getElementById("layer-select");
    let currentLayer = layers.photo;
    layerSelect.addEventListener("change", () => {
      map.removeLayer(currentLayer);
      currentLayer = layers[layerSelect.value] || layers.photo;
      map.addLayer(currentLayer);
    });

    document.getElementById("btn-fit-all").addEventListener("click", () => {
      const visibleMarkers = Array.from(markersById.values()).filter((m) => map.hasLayer(m));
      if (visibleMarkers.length === 0) return;
      const group = L.featureGroup(visibleMarkers);
      map.fitBounds(group.getBounds().pad(0.08));
    });

    // 2地点ルート（直線距離・ライン表示）
    const routeFrom = document.getElementById("route-from");
    const routeTo = document.getElementById("route-to");
    const routeResult = document.getElementById("route-result");

    SPOTS.forEach((s) => {
      routeFrom.add(new Option(`${s.id}. ${s.name}`, s.id));
      routeTo.add(new Option(`${s.id}. ${s.name}`, s.id));
    });
    if (SPOTS.length > 1) routeTo.selectedIndex = 1;

    function calcDistanceKm(a, b) {
      const R = 6371;
      const toRad = (d) => (d * Math.PI) / 180;
      const dLat = toRad(b.lat - a.lat);
      const dLng = toRad(b.lng - a.lng);
      const x =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLng / 2) ** 2;
      return 2 * R * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
    }

    document.getElementById("btn-calc-route").addEventListener("click", () => {
      const sA = SPOTS.find((s) => s.id === Number(routeFrom.value));
      const sB = SPOTS.find((s) => s.id === Number(routeTo.value));
      if (!sA || !sB) return;

      if (routeLine) map.removeLayer(routeLine);
      routeLine = L.polyline([[sA.lat, sA.lng], [sB.lat, sB.lng]], {
        color: "#ffffff",
        weight: 3,
        dashArray: "6, 6",
        opacity: 0.95
      }).addTo(map);

      map.fitBounds(routeLine.getBounds().pad(0.2));
      const dist = calcDistanceKm(sA, sB);
      routeResult.classList.remove("hidden");
      routeResult.innerHTML = `
        <div class="font-bold text-neutral-900">${sA.name} → ${sB.name}</div>
        <div class="mt-1 text-neutral-600">直線距離：約 ${dist.toFixed(2)} km</div>
      `;
    });

    document.getElementById("btn-clear-route").addEventListener("click", () => {
      if (routeLine) {
        map.removeLayer(routeLine);
        routeLine = null;
      }
      routeResult.classList.add("hidden");
    });

    searchInput.addEventListener("input", renderList);
    seriesFilter.addEventListener("change", renderList);
    sortSelect.addEventListener("change", renderList);

    renderList();
  </script>
</body>
</html>
