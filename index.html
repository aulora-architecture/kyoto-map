<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>京都 建築巡りマップ | aulora</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    }
    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
    }
    /* スマホ：上部に地図、下部に操作・詳細シート */
    #map-stage {
      position: relative;
      width: 100%;
      height: 62%;
      min-height: 220px;
      flex-shrink: 0;
      transition: height 0.22s ease;
      background: #1e293b;
    }
    #map-stage.expanded-map {
      height: calc(100% - 52px);
    }
    #map {
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    #bottom-sheet {
      position: relative;
      flex: 1;
      min-height: 52px;
      background: #0f172a;
      border-top: 1px solid #334155;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 10;
    }
    #sheet-handle-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      cursor: pointer;
      user-select: none;
      flex-shrink: 0;
    }
    .handle-pill {
      width: 36px;
      height: 4px;
      border-radius: 999px;
      background: #64748b;
      margin: 0 auto;
    }
    #sheet-content {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px 20px;
    }

    /* PC（md以上）：左にパネル、右に地図 */
    @media (min-width: 768px) {
      #app {
        flex-direction: row;
      }
      #bottom-sheet {
        order: 1;
        width: 390px;
        max-width: 45vw;
        height: 100%;
        flex: none;
        border-top: none;
        border-right: 1px solid #334155;
      }
      #map-stage {
        order: 2;
        flex: 1;
        width: auto;
        height: 100% !important;
      }
      #sheet-handle-bar {
        display: none;
      }
    }

    .spot-marker {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      background: #0284c7;
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      border: 2px solid #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
      transition: transform 0.15s ease, background-color 0.15s ease;
    }
    .spot-marker.active {
      background: #f59e0b;
      color: #0f172a;
      transform: scale(1.2);
      z-index: 999 !important;
    }
    .leaflet-control-attribution {
      font-size: 10px !important;
      background: rgba(15, 23, 42, 0.78) !important;
      color: #e2e8f0 !important;
    }
    .leaflet-control-attribution a {
      color: #7dd3fc !important;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- 地図エリア -->
    <div id="map-stage">
      <div id="map"></div>

      <!-- 地図右上のコンパクト操作 -->
      <div class="absolute top-2.5 right-2.5 z-[400] flex flex-col gap-1.5 items-end">
        <select id="layer-select" aria-label="地図の種類"
          class="bg-slate-900/90 text-slate-100 text-xs border border-slate-600 rounded-lg px-2.5 py-1.5 shadow backdrop-blur">
          <option value="photo" selected>航空写真</option>
          <option value="std">標準地図</option>
          <option value="pale">淡色地図</option>
        </select>
        <button id="btn-fit-all" type="button"
          class="bg-slate-900/90 hover:bg-slate-800 text-slate-100 text-xs border border-slate-600 rounded-lg px-2.5 py-1.5 shadow backdrop-blur">
          全体表示
        </button>
      </div>
    </div>

    <!-- 下部シート（スマホ）／左パネル（PC） -->
    <div id="bottom-sheet">
      <div id="sheet-handle-bar" title="タップで地図を広く／シートを開く">
        <span id="sheet-status-label" class="text-[11px] text-slate-300 truncate">スポット一覧・詳細</span>
        <div class="handle-pill"></div>
        <button id="btn-toggle-sheet" type="button" class="text-[11px] text-sky-400 font-medium">
          地図を広く
        </button>
      </div>

      <!-- タブバー -->
      <div class="flex border-b border-slate-800 bg-slate-900/70 shrink-0">
        <button data-tab="list" class="tab-btn flex-1 py-2 text-xs font-semibold text-sky-400 border-b-2 border-sky-400">
          探す (<span id="count-badge">0</span>)
        </button>
        <button data-tab="detail" class="tab-btn flex-1 py-2 text-xs font-semibold text-slate-400 border-b-2 border-transparent">
          詳細
        </button>
        <button data-tab="route" class="tab-btn flex-1 py-2 text-xs font-semibold text-slate-400 border-b-2 border-transparent">
          2地点ルート
        </button>
      </div>

      <!-- タブ中身 -->
      <div id="sheet-content">
        <!-- 1. 探すタブ -->
        <div id="tab-list" class="space-y-2.5">
          <div class="flex gap-1.5">
            <input id="search-input" type="text" placeholder="建築名・設計者・エリアで検索"
              class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-100 placeholder-slate-400 focus:outline-none focus:border-sky-400" />
            <select id="series-filter"
              class="bg-slate-800 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-sky-400">
              <option value="all">全編</option>
              <option value="京都編1">京都編1</option>
              <option value="京都編2">京都編2</option>
              <option value="京都編3">京都編3</option>
              <option value="京都編4">京都編4</option>
              <option value="京都編5">京都編5</option>
              <option value="京都編6">京都編6</option>
            </select>
          </div>
          <div id="spot-list" class="space-y-1.5"></div>
        </div>

        <!-- 2. 詳細タブ -->
        <div id="tab-detail" class="hidden space-y-3">
          <div id="detail-empty" class="text-xs text-slate-400 py-6 text-center">
            地図上のピンまたは「探す」から建築を選ぶと詳細が表示されます。
          </div>
          <div id="detail-body" class="hidden space-y-3">
            <div class="flex items-start justify-between gap-2">
              <div>
                <span id="detail-series" class="inline-block text-[10px] px-2 py-0.5 rounded bg-sky-950 text-sky-300 border border-sky-800 mb-1"></span>
                <h2 id="detail-name" class="text-base font-bold text-white leading-snug"></h2>
                <p id="detail-meta" class="text-xs text-slate-300 mt-0.5"></p>
              </div>
              <button id="btn-close-detail" type="button"
                class="text-xs px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 shrink-0">
                閉じる
              </button>
            </div>

            <!-- 写真表示エリア（1〜2枚・設定時のみ表示） -->
            <div id="detail-photos" class="grid grid-cols-2 gap-2"></div>

            <!-- メモ -->
            <p id="detail-memo" class="text-xs text-slate-200 leading-relaxed bg-slate-800/70 p-2.5 rounded-lg border border-slate-700/70"></p>

            <!-- 同じ設計者の作品（竣工年順） -->
            <div id="same-architect-box" class="hidden pt-1 border-t border-slate-800">
              <h3 id="same-architect-title" class="text-xs font-bold text-amber-300 mb-1.5"></h3>
              <div id="same-architect-list" class="space-y-1"></div>
            </div>
          </div>
        </div>

        <!-- 3. 2地点ルートタブ -->
        <div id="tab-route" class="hidden space-y-2.5">
          <div>
            <label class="block text-[11px] text-slate-400 mb-1">出発地</label>
            <select id="route-from" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-100"></select>
          </div>
          <div>
            <label class="block text-[11px] text-slate-400 mb-1">目的地</label>
            <select id="route-to" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-100"></select>
          </div>
          <div class="flex gap-2">
            <button id="btn-calc-route" type="button"
              class="flex-1 bg-sky-600 hover:bg-sky-500 text-white text-xs font-semibold py-2 rounded-lg">
              直線距離・ルート表示
            </button>
            <button id="btn-clear-route" type="button"
              class="px-3 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs rounded-lg border border-slate-700">
              消去
            </button>
          </div>
          <div id="route-result" class="text-xs text-slate-300 bg-slate-800/60 p-2.5 rounded-lg border border-slate-800 hidden"></div>
        </div>
      </div>
    </div>
  </div>

    ];

    // 地図レイヤー（初期設定は航空写真）
    const layers = {
      photo: L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg", {
        maxZoom: 18,
        attribution: "<a href='https://maps.gsi.go.jp/development/ichiran.html' target='_blank' rel='noopener'>国土地理院</a>"
      }),
      std: L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png", {
        maxZoom: 18,
        attribution: "<a href='https://maps.gsi.go.jp/development/ichiran.html' target='_blank' rel='noopener'>国土地理院</a>"
      }),
      pale: L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png", {
        maxZoom: 18,
        attribution: "<a href='https://maps.gsi.go.jp/development/ichiran.html' target='_blank' rel='noopener'>国土地理院</a>"
      })
    };

    const map = L.map("map", {
      center: [35.0116, 135.7681],
      zoom: 12,
      layers: [layers.photo],
      zoomControl: true
    });

    const markersById = new Map();
    let activeSpotId = null;
    let routeLine = null;

    // マーカー生成
    SPOTS.forEach((spot) => {
      const icon = L.divIcon({
        className: "custom-div-icon",
        html: `<div id="marker-${spot.id}" class="spot-marker">${spot.id}</div>`,
        iconSize: [28, 28],
        iconAnchor: [14, 14]
      });
      const marker = L.marker([spot.lat, spot.lng], { icon }).addTo(map);
      marker.on("click", () => selectSpot(spot.id, { openSheet: true, flyTo: false }));
      markersById.set(spot.id, marker);
    });

    // シート開閉状態（スマホ用）
    const mapStage = document.getElementById("map-stage");
    const btnToggleSheet = document.getElementById("btn-toggle-sheet");
    const sheetHandleBar = document.getElementById("sheet-handle-bar");
    const sheetStatusLabel = document.getElementById("sheet-status-label");

    function setMapExpanded(expanded) {
      if (expanded) {
        mapStage.classList.add("expanded-map");
        btnToggleSheet.textContent = "シートを開く";
      } else {
        mapStage.classList.remove("expanded-map");
        btnToggleSheet.textContent = "地図を広く";
      }
      setTimeout(() => map.invalidateSize(), 240);
    }

    sheetHandleBar.addEventListener("click", () => {
      setMapExpanded(!mapStage.classList.contains("expanded-map"));
    });

    // タブ切り替え
    const tabBtns = document.querySelectorAll(".tab-btn");
    const tabPanels = {
      list: document.getElementById("tab-list"),
      detail: document.getElementById("tab-detail"),
      route: document.getElementById("tab-route")
    };

    function switchTab(tabName) {
      tabBtns.forEach((btn) => {
        const isTarget = btn.dataset.tab === tabName;
        btn.classList.toggle("text-sky-400", isTarget);
        btn.classList.toggle("border-sky-400", isTarget);
        btn.classList.toggle("text-slate-400", !isTarget);
        btn.classList.toggle("border-transparent", !isTarget);
      });
      Object.entries(tabPanels).forEach(([key, panel]) => {
        panel.classList.toggle("hidden", key !== tabName);
      });
      if (tabName === "detail") {
        setMapExpanded(false);
      }
    }

    tabBtns.forEach((btn) => {
      btn.addEventListener("click", () => {
        setMapExpanded(false);
        switchTab(btn.dataset.tab);
      });
    });

    // 一覧描画
    const searchInput = document.getElementById("search-input");
    const seriesFilter = document.getElementById("series-filter");
    const spotListEl = document.getElementById("spot-list");
    const countBadge = document.getElementById("count-badge");

    function renderList() {
      const q = searchInput.value.trim().toLowerCase();
      const ser = seriesFilter.value;

      const filtered = SPOTS.filter((s) => {
        const matchSeries = ser === "all" || s.series === ser;
        const matchQuery =
          !q ||
          s.name.toLowerCase().includes(q) ||
          s.architect.toLowerCase().includes(q) ||
          s.area.toLowerCase().includes(q) ||
          String(s.id).includes(q);
        return matchSeries && matchQuery;
      });

      countBadge.textContent = filtered.length;
      spotListEl.innerHTML = "";

      filtered.forEach((s) => {
        const item = document.createElement("button");
        item.type = "button";
        item.className =
          "w-full text-left px-2.5 py-2 rounded-lg border transition flex items-center justify-between gap-2 " +
          (s.id === activeSpotId
            ? "bg-sky-950/80 border-sky-500 text-white"
            : "bg-slate-800/60 hover:bg-slate-800 border-slate-700/70 text-slate-200");
        item.innerHTML = `
          <div class="min-w-0">
            <div class="text-xs font-semibold truncate">${s.id}. ${s.name}</div>
            <div class="text-[11px] text-slate-400 truncate">${s.architect}（${s.year}） · ${s.series}</div>
          </div>
          <span class="text-[10px] text-slate-400 shrink-0">${s.area}</span>
        `;
        item.addEventListener("click", () => {
          selectSpot(s.id, { openSheet: true, flyTo: true });
        });
        spotListEl.appendChild(item);
      });
    }

    // スポット選択＆詳細表示
    const detailEmpty = document.getElementById("detail-empty");
    const detailBody = document.getElementById("detail-body");
    const detailSeries = document.getElementById("detail-series");
    const detailName = document.getElementById("detail-name");
    const detailMeta = document.getElementById("detail-meta");
    const detailPhotos = document.getElementById("detail-photos");
    const detailMemo = document.getElementById("detail-memo");
    const sameArchitectBox = document.getElementById("same-architect-box");
    const sameArchitectTitle = document.getElementById("same-architect-title");
    const sameArchitectList = document.getElementById("same-architect-list");

    function selectSpot(id, { openSheet = true, flyTo = true } = {}) {
      const spot = SPOTS.find((s) => s.id === id);
      if (!spot) return;

      if (activeSpotId !== null) {
        const prevEl = document.getElementById(`marker-${activeSpotId}`);
        if (prevEl) prevEl.classList.remove("active");
      }
      activeSpotId = spot.id;
      const currEl = document.getElementById(`marker-${spot.id}`);
      if (currEl) currEl.classList.add("active");

      sheetStatusLabel.textContent = `${spot.id}. ${spot.name}`;

      if (flyTo) {
        map.setView([spot.lat, spot.lng], Math.max(map.getZoom(), 14), { animate: true });
      }

      detailEmpty.classList.add("hidden");
      detailBody.classList.remove("hidden");
      detailSeries.textContent = `${spot.series} · No.${spot.id}`;
      detailName.textContent = spot.name;
      detailMeta.textContent = `設計：${spot.architect} ／ 竣工：${spot.year}年 ／ ${spot.area}`;
      detailMemo.textContent = spot.memo || "";

      // 写真（1〜2枚、指定がある場合のみ表示）
      detailPhotos.innerHTML = "";
      const validPhotos = Array.isArray(spot.photos) ? spot.photos.filter(Boolean).slice(0, 2) : [];
      if (validPhotos.length > 0) {
        detailPhotos.classList.remove("hidden");
        detailPhotos.className = validPhotos.length === 1 ? "grid grid-cols-1 gap-2" : "grid grid-cols-2 gap-2";
        validPhotos.forEach((src) => {
          const img = document.createElement("img");
          img.src = src;
          img.alt = spot.name;
          img.loading = "lazy";
          img.className = "w-full h-32 object-cover rounded-lg border border-slate-700 bg-slate-800";
          img.onerror = () => img.remove();
          detailPhotos.appendChild(img);
        });
      } else {
        detailPhotos.classList.add("hidden");
      }

      // 同じ設計者の作品（竣工年順）
      const isUnknown = !spot.architect || ["不詳", "各種"].includes(spot.architect.trim());
      const sameArchWorks = isUnknown
        ? []
        : SPOTS
            .filter((s) => s.architect.trim() === spot.architect.trim())
            .sort((a, b) => a.year - b.year || a.id - b.id);

      if (sameArchWorks.length > 1) {
        sameArchitectBox.classList.remove("hidden");
        sameArchitectTitle.textContent = `同じ設計者の作品（${spot.architect}・竣工年順）`;
        sameArchitectList.innerHTML = "";
        sameArchWorks.forEach((w) => {
          const btn = document.createElement("button");
          btn.type = "button";
          const isCurrent = w.id === spot.id;
          btn.className =
            "w-full text-left px-2.5 py-1.5 rounded text-xs flex items-center justify-between border " +
            (isCurrent
              ? "bg-amber-500/20 border-amber-400/60 text-amber-200 font-semibold"
              : "bg-slate-800/70 hover:bg-slate-800 border-slate-700/60 text-slate-200");
          btn.innerHTML = `
            <span class="truncate">${w.id}. ${w.name}</span>
            <span class="text-[11px] text-slate-400 shrink-0 ml-2">${w.year}年</span>
          `;
          btn.addEventListener("click", () => {
            selectSpot(w.id, { openSheet: true, flyTo: true });
          });
          sameArchitectList.appendChild(btn);
        });
      } else {
        sameArchitectBox.classList.add("hidden");
        sameArchitectList.innerHTML = "";
      }

      if (openSheet) {
        setMapExpanded(false);
        switchTab("detail");
      }
      renderList();
    }

    document.getElementById("btn-close-detail").addEventListener("click", () => {
      switchTab("list");
      setMapExpanded(true);
    });

    // レイヤー切替＆全体表示
    const layerSelect = document.getElementById("layer-select");
    let currentLayer = layers.photo;
    layerSelect.addEventListener("change", () => {
      map.removeLayer(currentLayer);
      currentLayer = layers[layerSelect.value] || layers.photo;
      map.addLayer(currentLayer);
    });

    document.getElementById("btn-fit-all").addEventListener("click", () => {
      const group = L.featureGroup(Array.from(markersById.values()));
      map.fitBounds(group.getBounds().pad(0.08));
    });

    // 2地点ルート（直線距離・ライン表示）
    const routeFrom = document.getElementById("route-from");
    const routeTo = document.getElementById("route-to");
    const routeResult = document.getElementById("route-result");

    SPOTS.forEach((s) => {
      const opt1 = new Option(`${s.id}. ${s.name}`, s.id);
      const opt2 = new Option(`${s.id}. ${s.name}`, s.id);
      routeFrom.add(opt1);
      routeTo.add(opt2);
    });
    if (SPOTS.length > 1) routeTo.selectedIndex = 1;

    function calcDistanceKm(a, b) {
      const R = 6371;
      const toRad = (d) => (d * Math.PI) / 180;
      const dLat = toRad(b.lat - a.lat);
      const dLng = toRad(b.lng - a.lng);
      const x =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLng / 2) ** 2;
      return 2 * R * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
    }

    document.getElementById("btn-calc-route").addEventListener("click", () => {
      const sA = SPOTS.find((s) => s.id === Number(routeFrom.value));
      const sB = SPOTS.find((s) => s.id === Number(routeTo.value));
      if (!sA || !sB) return;

      if (routeLine) map.removeLayer(routeLine);
      routeLine = L.polyline([[sA.lat, sA.lng], [sB.lat, sB.lng]], {
        color: "#f59e0b",
        weight: 3,
        dashArray: "6, 6"
      }).addTo(map);

      map.fitBounds(routeLine.getBounds().pad(0.2));
      const dist = calcDistanceKm(sA, sB);
      routeResult.classList.remove("hidden");
      routeResult.innerHTML = `
        <div class="font-semibold text-amber-300">${sA.name} → ${sB.name}</div>
        <div class="mt-1">直線距離：約 ${dist.toFixed(2)} km</div>
      `;
    });

    document.getElementById("btn-clear-route").addEventListener("click", () => {
      if (routeLine) {
        map.removeLayer(routeLine);
        routeLine = null;
      }
      routeResult.classList.add("hidden");
    });

    searchInput.addEventListener("input", renderList);
    seriesFilter.addEventListener("change", renderList);

    renderList();
  </script>
</body>
</html>
