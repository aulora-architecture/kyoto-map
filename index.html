<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>京都 建築巡りマップ | aulora</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <!-- Google Fonts: Inter & Noto Sans JP -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Noto Sans JP', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          },
          colors: {
            paper: '#f7f7f4',
            canvas: '#eeeeea',
            ink: '#161614',
            muted: '#6b6b66',
            line: '#e2e2dc',
          },
        },
      },
    };
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background-color: #f7f7f4;
      color: #161614;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* モノクロ地図モード用フィルター（国土地理院 淡色地図に適用） */
    .map-mono .leaflet-tile-pane {
      filter: grayscale(100%) contrast(1.05);
    }

    /* Leafletのデフォルト帰属表記をコンパクトに調整 */
    .leaflet-control-attribution {
      font-size: 9px !important;
      background: rgba(255, 255, 255, 0.78) !important;
      padding: 1px 5px !important;
      color: #444 !important;
    }

    /* 航空写真上でもくっきり見えるカスタム丸ピン */
    .spot-pin {
      width: 24px;
      height: 24px;
      border-radius: 9999px;
      border: 2.5px solid #ffffff;
      color: #ffffff;
      font-size: 10px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
      transition: transform 0.16s ease, box-shadow 0.16s ease;
    }

    .spot-pin.is-selected {
      transform: scale(1.32);
      border-width: 3px;
      box-shadow: 0 0 0 2px #161614, 0 4px 12px rgba(0, 0, 0, 0.5);
    }

    /* 2地点ルート用 A / B マーカー */
    .route-badge-pin {
      width: 30px;
      height: 30px;
      border-radius: 9999px;
      border: 3px solid #ffffff;
      font-size: 13px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.55);
    }

    .route-badge-a {
      background-color: #161614;
      color: #ffffff;
    }

    .route-badge-b {
      background-color: #b83b2d;
      color: #ffffff;
    }

    /* 横スクロールバー非表示 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>

<body class="h-dvh w-full flex flex-col md:flex-row bg-paper text-ink antialiased">

  <!-- =========================================================
       四角い地図エリア
       スマホ：上部（50dvh）、PC：右側（残り全幅＋余白＋枠線）
       ========================================================= -->
  <section
    id="mapOuter"
    class="order-1 md:order-2 h-[50dvh] md:h-full w-full md:flex-1 shrink-0 md:p-4 bg-canvas flex flex-col"
  >
    <div
      id="mapFrame"
      class="relative w-full h-full bg-neutral-200 border-b md:border border-[#d6d6cf] md:rounded-xl overflow-hidden md:shadow-sm"
    >
      <!-- Leaflet Map Container -->
      <div id="map" class="w-full h-full z-10"></div>

      <!-- 地図右下：超コンパクトなコントロール群のみ配置 -->
      <div class="absolute bottom-6 right-2.5 z-20 flex items-end gap-1.5">
        <!-- 全体表示ボタン -->
        <button
          id="btnFitBounds"
          type="button"
          title="表示中のピンを全体表示"
          aria-label="表示中のピンを全体表示"
          class="h-8 px-2.5 rounded-lg bg-white/95 backdrop-blur-sm border border-[#d6d6cf] shadow-md text-[11px] font-semibold text-ink flex items-center gap-1 hover:bg-neutral-50 active:scale-95 transition"
        >
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span>全体</span>
        </button>

        <!-- 地図スタイル切替ボタン＆超コンパクトメニュー -->
        <div class="relative">
          <div
            id="tileMenu"
            class="hidden absolute bottom-10 right-0 w-28 bg-white/95 backdrop-blur-sm border border-[#d6d6cf] rounded-lg shadow-lg overflow-hidden py-1"
          >
            <button type="button" data-tile="seamlessphoto" class="tile-opt w-full text-left px-3 py-1.5 text-[11px] font-medium hover:bg-neutral-100 flex items-center justify-between">
              <span>航空写真</span><span class="check-mark text-ink font-bold">✓</span>
            </button>
            <button type="button" data-tile="mono" class="tile-opt w-full text-left px-3 py-1.5 text-[11px] font-medium hover:bg-neutral-100 flex items-center justify-between">
              <span>モノクロ</span><span class="check-mark hidden text-ink font-bold">✓</span>
            </button>
            <button type="button" data-tile="pale" class="tile-opt w-full text-left px-3 py-1.5 text-[11px] font-medium hover:bg-neutral-100 flex items-center justify-between">
              <span>淡色地図</span><span class="check-mark hidden text-ink font-bold">✓</span>
            </button>
            <button type="button" data-tile="std" class="tile-opt w-full text-left px-3 py-1.5 text-[11px] font-medium hover:bg-neutral-100 flex items-center justify-between">
              <span>標準地図</span><span class="check-mark hidden text-ink font-bold">✓</span>
            </button>
          </div>

          <button
            id="btnTileMenu"
            type="button"
            class="h-8 px-2.5 rounded-lg bg-white/95 backdrop-blur-sm border border-[#d6d6cf] shadow-md text-[11px] font-semibold text-ink flex items-center gap-1 hover:bg-neutral-50 active:scale-95 transition"
          >
            <span id="currentTileLabel">航空写真</span>
            <svg class="w-3 h-3 text-muted" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- =========================================================
       操作・情報パネル
       スマホ：下部（残り50dvh）、PC：左側（幅376px）
       ========================================================= -->
  <aside
    id="controlPanel"
    class="order-2 md:order-1 flex-1 md:flex-none min-h-0 md:h-full w-full md:w-[376px] md:shrink-0 bg-white md:border-r border-line flex flex-col"
  >
    <!-- ヘッダー（PCはしっかり、スマホは超コンパクト） -->
    <header class="px-3.5 py-2 md:px-4 md:py-3 border-b border-line flex items-center justify-between shrink-0 bg-white">
      <div class="flex items-baseline gap-2 min-w-0">
        <h1 class="text-sm md:text-base font-bold tracking-tight text-ink truncate">
          京都 建築巡りマップ
        </h1>
        <span class="text-[11px] font-medium text-muted tracking-wider shrink-0">
          | aulora
        </span>
      </div>
      <span id="headerCountBadge" class="text-[11px] font-medium text-muted bg-paper border border-line px-2 py-0.5 rounded-full shrink-0">
        92件
      </span>
    </header>

    <!-- 3タブバー：【探す】【詳細】【2地点ルート】 -->
    <nav class="grid grid-cols-3 border-b border-line bg-paper/60 shrink-0" role="tablist">
      <button
        id="tabBtnSearch"
        type="button"
        role="tab"
        data-tab="search"
        class="tab-btn py-2.5 text-xs font-bold border-b-2 border-ink text-ink bg-white transition"
      >
        探す
      </button>
      <button
        id="tabBtnDetail"
        type="button"
        role="tab"
        data-tab="detail"
        class="tab-btn py-2.5 text-xs font-medium border-b-2 border-transparent text-muted hover:text-ink transition"
      >
        詳細
      </button>
      <button
        id="tabBtnRoute"
        type="button"
        role="tab"
        data-tab="route"
        class="tab-btn py-2.5 text-xs font-medium border-b-2 border-transparent text-muted hover:text-ink transition flex items-center justify-center gap-1"
      >
        <span>2地点ルート</span>
        <span id="routeActiveDot" class="hidden w-1.5 h-1.5 rounded-full bg-[#b83b2d]"></span>
      </button>
    </nav>

    <!-- タブ中身（縦スクロール領域） -->
    <div class="flex-1 min-h-0 overflow-y-auto">

      <!-- 1. 【探す】タブ -->
      <div id="tabPanelSearch" class="p-3.5 md:p-4 space-y-3">
        <!-- キーワード検索 -->
        <div class="relative flex items-center">
          <svg class="w-4 h-4 text-muted absolute left-3 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="7" />
            <path d="M21 21l-4.35-4.35" stroke-linecap="round" />
          </svg>
          <input
            id="searchInput"
            type="text"
            placeholder="施設名・設計者・駅・メモで検索..."
            class="w-full pl-9 pr-8 py-2 text-xs md:text-sm bg-paper border border-line rounded-lg text-ink placeholder:text-muted/70 focus:outline-none focus:border-ink focus:bg-white transition"
          />
          <button
            id="clearSearchBtn"
            type="button"
            class="hidden absolute right-2 p-1 text-muted hover:text-ink"
            aria-label="検索をクリア"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M18 6L6 18M6 6l12 12" stroke-linecap="round" />
            </svg>
          </button>
        </div>

        <!-- エリア絞り込みチップ -->
        <div id="areaChips" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-0.5">
          <!-- JSで生成 -->
        </div>

        <!-- 件数＆リセット -->
        <div class="flex items-center justify-between text-[11px] text-muted pt-0.5">
          <span id="searchCountText">全92スポットを表示中</span>
          <button
            id="resetFilterBtn"
            type="button"
            class="hidden text-ink underline underline-offset-2 font-medium hover:opacity-75"
          >
            絞り込み解除
          </button>
        </div>

        <!-- スポット一覧リスト -->
        <div id="spotList" class="space-y-2 pb-4">
          <!-- JSで生成 -->
        </div>
      </div>

      <!-- 2. 【詳細】タブ -->
      <div id="tabPanelDetail" class="hidden p-3.5 md:p-4">
        <!-- 未選択時 -->
        <div id="detailEmpty" class="py-10 px-4 text-center space-y-2">
          <p class="text-sm font-semibold text-ink">スポットが未選択です</p>
          <p class="text-xs text-muted leading-relaxed">
            地図上のピンをタップするか、「探す」タブの一覧から建築を選ぶと詳細・解説記事・経路ボタンが表示されます。
          </p>
        </div>

        <!-- 選択中の詳細カード -->
        <div id="detailCard" class="hidden space-y-3.5 pb-4">
          <!-- エリアバッジ＆前後移動 -->
          <div class="flex items-center justify-between gap-2">
            <span
              id="detailAreaBadge"
              class="inline-flex items-center gap-1.5 text-[11px] font-semibold px-2.5 py-0.5 rounded-full text-white"
            ></span>
            <div class="flex items-center gap-1">
              <button
                id="btnPrevSpot"
                type="button"
                class="px-2 py-1 text-[11px] font-medium border border-line rounded-md hover:bg-paper active:scale-95 transition"
              >
                ← 前
              </button>
              <button
                id="btnNextSpot"
                type="button"
                class="px-2 py-1 text-[11px] font-medium border border-line rounded-md hover:bg-paper active:scale-95 transition"
              >
                次 →
              </button>
            </div>
          </div>

          <!-- 施設名 -->
          <h2 id="detailName" class="text-base md:text-lg font-bold leading-snug text-ink"></h2>

          <!-- 基本情報ボックス -->
          <div class="bg-paper border border-line rounded-xl p-3 space-y-2 text-xs">
            <div class="flex gap-2">
              <span class="text-muted shrink-0 w-16">設計・年代</span>
              <span id="detailArchitect" class="font-medium text-ink"></span>
            </div>
            <div class="flex gap-2">
              <span class="text-muted shrink-0 w-16">最寄り駅</span>
              <span id="detailStation" class="text-ink"></span>
            </div>
          </div>

          <!-- ひとことメモ -->
          <div class="space-y-1">
            <div class="text-[11px] font-semibold text-muted">ひとことメモ</div>
            <p id="detailMemo" class="text-xs md:text-[13px] leading-relaxed text-ink/90"></p>
          </div>

          <!-- 主要アクションボタン群 -->
          <div class="space-y-2 pt-1">
            <a
              id="detailNoteBtn"
              href="#"
              target="_blank"
              rel="noopener noreferrer"
              class="w-full flex items-center justify-center gap-1.5 py-2.5 px-3 rounded-lg bg-ink text-white text-xs font-semibold hover:bg-neutral-800 active:scale-[0.99] transition"
            >
              <span id="detailNoteBtnText">解説記事を読む</span>
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </a>

            <a
              id="detailTransitBtn"
              href="#"
              target="_blank"
              rel="noopener noreferrer"
              class="w-full flex items-center justify-center gap-1.5 py-2.5 px-3 rounded-lg bg-white border border-ink text-ink text-xs font-semibold hover:bg-paper active:scale-[0.99] transition"
            >
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M8 6v6m8-6v6M5 12h14M7 18l-2 2m12-2l2 2M6 3h12a2 2 0 012 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2V5a2 2 0 012-2z" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
              <span>Googleマップで経路（電車・バス）</span>
            </a>

            <!-- 出発地A / 目的地B に設定 -->
            <div class="grid grid-cols-2 gap-2">
              <button
                id="btnSetA"
                type="button"
                class="py-2 px-2.5 rounded-lg bg-paper border border-line text-[11px] font-semibold text-ink hover:border-ink transition active:scale-95"
              >
                出発地 A に設定
              </button>
              <button
                id="btnSetB"
                type="button"
                class="py-2 px-2.5 rounded-lg bg-paper border border-line text-[11px] font-semibold text-ink hover:border-ink transition active:scale-95"
              >
                目的地 B に設定
              </button>
            </div>
          </div>

          <!-- 同じ設計者の建築（竣工年順） -->
          <div id="sameArchitectSection" class="hidden pt-3 border-t border-line space-y-2.5">
            <div class="flex items-center justify-between">
              <h3 class="text-xs font-bold text-ink">同じ設計者の建築</h3>
              <span class="text-[10px] text-muted">竣工年順</span>
            </div>
            <div id="sameArchitectGroups" class="space-y-3">
              <!-- JSで生成 -->
            </div>
          </div>
        </div>
      </div>

      <!-- 3. 【2地点ルート】タブ -->
      <div id="tabPanelRoute" class="hidden p-3.5 md:p-4 space-y-3.5 pb-6">
        <div class="flex items-center justify-between">
          <p class="text-xs text-muted">2つの建築を選んで距離と目安時間を計算</p>
          <div class="flex items-center gap-1.5">
            <button
              id="btnSwapAB"
              type="button"
              class="px-2.5 py-1 text-[11px] font-semibold rounded-md border border-line bg-paper hover:border-ink transition active:scale-95"
            >
              A⇔B
            </button>
            <button
              id="btnClearRoute"
              type="button"
              class="px-2.5 py-1 text-[11px] font-medium rounded-md border border-line text-muted hover:text-ink hover:border-ink transition active:scale-95"
            >
              クリア
            </button>
          </div>
        </div>

        <!-- セレクトボックス A / B -->
        <div class="space-y-2.5">
          <div class="space-y-1">
            <label for="selectOriginA" class="flex items-center gap-1.5 text-[11px] font-bold text-ink">
              <span class="w-4 h-4 rounded-full bg-[#161614] text-white inline-flex items-center justify-center text-[10px]">A</span>
              <span>出発地</span>
            </label>
            <select
              id="selectOriginA"
              class="w-full py-2 px-2.5 text-xs bg-paper border border-line rounded-lg text-ink focus:outline-none focus:border-ink focus:bg-white"
            ></select>
          </div>

          <div class="space-y-1">
            <label for="selectDestB" class="flex items-center gap-1.5 text-[11px] font-bold text-ink">
              <span class="w-4 h-4 rounded-full bg-[#b83b2d] text-white inline-flex items-center justify-center text-[10px]">B</span>
              <span>目的地</span>
            </label>
            <select
              id="selectDestB"
              class="w-full py-2 px-2.5 text-xs bg-paper border border-line rounded-lg text-ink focus:outline-none focus:border-ink focus:bg-white"
            ></select>
          </div>
        </div>

        <!-- 計算結果ボックス -->
        <div id="routeResultBox" class="hidden space-y-3 pt-1">
          <div class="bg-paper border border-line rounded-xl p-3 space-y-2.5">
            <div class="flex items-baseline justify-between border-b border-line pb-2">
              <span class="text-[11px] text-muted">直線 / 道のり目安</span>
              <span id="routeDistText" class="text-sm font-bold text-ink"></span>
            </div>
            <div class="grid grid-cols-3 gap-2 text-center">
              <div class="bg-white border border-line rounded-lg py-2 px-1">
                <div class="text-[10px] text-muted">徒歩目安</div>
                <div id="routeWalkText" class="text-xs font-bold text-ink mt-0.5"></div>
              </div>
              <div class="bg-white border border-line rounded-lg py-2 px-1">
                <div class="text-[10px] text-muted">電車・バス</div>
                <div id="routeTransitText" class="text-xs font-bold text-ink mt-0.5"></div>
              </div>
              <div class="bg-white border border-line rounded-lg py-2 px-1">
                <div class="text-[10px] text-muted">タクシー</div>
                <div id="routeTaxiText" class="text-xs font-bold text-ink mt-0.5"></div>
              </div>
            </div>
          </div>

          <a
            id="btnGoogleRouteAB"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
            class="w-full flex items-center justify-center gap-1.5 py-2.5 px-3 rounded-lg bg-ink text-white text-xs font-semibold hover:bg-neutral-800 active:scale-[0.99] transition"
          >
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M8 6v6m8-6v6M5 12h14M7 18l-2 2m12-2l2 2M6 3h12a2 2 0 012 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2V5a2 2 0 012-2z" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span>A → B の電車・バス経路をGoogleマップで検索</span>
          </a>
        </div>

        <!-- 未完了メッセージ -->
        <div id="routeHintBox" class="bg-paper border border-dashed border-line rounded-xl p-4 text-center text-xs text-muted leading-relaxed">
          出発地(A)と目的地(B)をそれぞれ選ぶと、地図上にルート線を引き、距離と移動時間の目安を表示します。
        </div>
      </div>

    </div>
  </aside>

  <!-- トースト通知（alert代替） -->
  <div
    id="toast"
    class="pointer-events-none fixed top-3 left-1/2 -translate-x-1/2 z-50 bg-ink/90 text-white text-xs font-medium px-3.5 py-1.5 rounded-full shadow-lg opacity-0 transition-opacity duration-200 whitespace-nowrap"
  ></div>

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script>
    /**
     * エリア定義（京都編1〜6：落ち着いた建築アーカイブ配色＋note記事URL）
     */
    const AREAS = {
      1: { key: 1, short: '京都編1', label: '京都編1（洛北）', color: '#2f4858', url: 'https://note.com/aulora/n/nd23fc113ecee' },
      2: { key: 2, short: '京都編2', label: '京都編2（北白川〜岡崎）', color: '#3b6978', url: 'https://note.com/aulora/n/nd24a98eb992e' },

    ];

    /**
     * アプリケーション状態
     */
    const appState = {
      activeTab: 'search', // 'search' | 'detail' | 'route'
      selectedArea: 'all', // 'all' | 1..6
      searchQuery: '',
      selectedSpotId: null,
      routeA: null,
      routeB: null,
      tileKey: 'seamlessphoto',
    };

    /**
     * Leafletインスタンス管理
     */
    let mapInstance = null;
    let baseTileLayer = null;
    let spotMarkerGroup = null;
    let routeOverlayGroup = null;
    let toastTimer = null;

    /**
     * トースト通知表示
     */
    function showToast(message) {
      const el = document.getElementById('toast');
      el.textContent = message;
      el.classList.remove('opacity-0');
      el.classList.add('opacity-100');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        el.classList.remove('opacity-100');
        el.classList.add('opacity-0');
      }, 2000);
    }

    /**
     * 絞り込み済みスポット配列を返す
     */
    function getFilteredSpots() {
      const q = appState.searchQuery.trim().toLowerCase();
      return SPOTS.filter((s) => {
        if (appState.selectedArea !== 'all' && s.area !== appState.selectedArea) {
          return false;
        }
        if (q) {
          const areaObj = AREAS[s.area];
          const text = `${s.name} ${s.arch} ${s.station} ${s.memo} ${areaObj.label}`.toLowerCase();
          if (!text.includes(q)) return false;
        }
        return true;
      });
    }

    /**
     * Haversine公式による2点間直線距離（km）
     */
    function haversineKm(lat1, lng1, lat2, lng2) {
      const rad = (d) => (d * Math.PI) / 180;
      const R = 6371;
      const dLat = rad(lat2 - lat1);
      const dLng = rad(lng2 - lng1);
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(rad(lat1)) * Math.cos(rad(lat2)) *
        Math.sin(dLng / 2) * Math.sin(dLng / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    /**
     * 分数を読みやすい表記へフォーマット
     */
    function formatDuration(mins) {
      const m = Math.max(1, Math.round(mins));
      if (m < 60) return `約${m}分`;
      const h = Math.floor(m / 60);
      const rem = m % 60;
      return rem === 0 ? `約${h}時間` : `約${h}時間${rem}分`;
    }

    /**
     * タブ切り替え
     */
    function switchTab(tabName) {
      appState.activeTab = tabName;

      document.querySelectorAll('.tab-btn').forEach((btn) => {
        const isTarget = btn.dataset.tab === tabName;
        btn.classList.toggle('border-ink', isTarget);
        btn.classList.toggle('text-ink', isTarget);
        btn.classList.toggle('font-bold', isTarget);
        btn.classList.toggle('bg-white', isTarget);
        btn.classList.toggle('border-transparent', !isTarget);
        btn.classList.toggle('text-muted', !isTarget);
        btn.classList.toggle('font-medium', !isTarget);
      });

      document.getElementById('tabPanelSearch').classList.toggle('hidden', tabName !== 'search');
      document.getElementById('tabPanelDetail').classList.toggle('hidden', tabName !== 'detail');
      document.getElementById('tabPanelRoute').classList.toggle('hidden', tabName !== 'route');
    }

    /**
     * 国土地理院タイルの切り替え
     */
    function setMapTile(tileKey) {
      const cfg = GSI_TILES[tileKey] || GSI_TILES.seamlessphoto;
      appState.tileKey = tileKey;

      if (baseTileLayer) {
        mapInstance.removeLayer(baseTileLayer);
      }

      baseTileLayer = L.tileLayer(cfg.url, {
        maxZoom: cfg.maxZoom,
        attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">国土地理院</a>',
      }).addTo(mapInstance);

      const frame = document.getElementById('mapFrame');
      frame.classList.toggle('map-mono', cfg.mono);

      document.getElementById('currentTileLabel').textContent = cfg.label;
      document.querySelectorAll('.tile-opt').forEach((btn) => {
        const mark = btn.querySelector('.check-mark');
        mark.classList.toggle('hidden', btn.dataset.tile !== tileKey);
      });
    }

    /**
     * 地図の初期化
     */
    function initMap() {
      mapInstance = L.map('map', {
        zoomControl: false,
        attributionControl: true,
      }).setView([35.016, 135.768], 12);

      // 左上に控えめなズームボタンを配置
      L.control.zoom({ position: 'topleft' }).addTo(mapInstance);

      setMapTile(appState.tileKey);

      spotMarkerGroup = L.layerGroup().addTo(mapInstance);
      routeOverlayGroup = L.layerGroup().addTo(mapInstance);

      // 地図の余白タップでタイルメニューを閉じる
      mapInstance.on('click', () => {
        document.getElementById('tileMenu').classList.add('hidden');
      });

      window.addEventListener('resize', () => {
        if (mapInstance) mapInstance.invalidateSize();
      });
    }

    /**
     * エリア絞り込みチップ描画
     */
    function renderAreaChips() {
      const container = document.getElementById('areaChips');
      container.innerHTML = '';

      const chipList = [
        { key: 'all', label: 'すべて', color: '#161614' },
        ...Object.values(AREAS).map((a) => ({ key: a.key, label: a.label, color: a.color })),
      ];

      chipList.forEach((item) => {
        const isActive = appState.selectedArea === item.key;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `px-2.5 py-1 rounded-full text-[11px] font-semibold whitespace-nowrap shrink-0 flex items-center gap-1.5 border transition active:scale-95 ${
          isActive
            ? 'bg-ink text-white border-ink'
            : 'bg-paper text-ink border-line hover:border-ink/50'
        }`;

        if (item.key !== 'all') {
          const dot = document.createElement('span');
          dot.className = 'w-2 h-2 rounded-full shrink-0';
          dot.style.backgroundColor = isActive ? '#ffffff' : item.color;
          btn.appendChild(dot);
        }

        const labelSpan = document.createElement('span');
        labelSpan.textContent = item.label;
        btn.appendChild(labelSpan);

        btn.addEventListener('click', () => {
          appState.selectedArea = item.key;
          refreshView();
          fitToCurrentSpots(false);
        });

        container.appendChild(btn);
      });
    }

    /**
     * 地図上のスポットピン描画
     */
    function renderMarkers(filteredSpots) {
      spotMarkerGroup.clearLayers();

      filteredSpots.forEach((spot) => {
        const areaInfo = AREAS[spot.area];
        const isSelected = spot.id === appState.selectedSpotId;
        const icon = L.divIcon({
          className: '',
          html: `<div class="spot-pin ${isSelected ? 'is-selected' : ''}" style="background-color:${areaInfo.color};">${spot.id}</div>`,
          iconSize: [24, 24],
          iconAnchor: [12, 12],
        });

        const marker = L.marker([spot.lat, spot.lng], {
          icon,
          zIndexOffset: isSelected ? 600 : 100,
        });

        marker.on('click', (e) => {
          L.DomEvent.stopPropagation(e);
          document.getElementById('tileMenu').classList.add('hidden');
          selectSpot(spot.id, { pan: true, openDetail: true });
        });

        marker.addTo(spotMarkerGroup);
      });
    }

    /**
     * 【探す】タブのスポット一覧描画
     */
    function renderSpotList(filteredSpots) {
      const listEl = document.getElementById('spotList');
      const countText = document.getElementById('searchCountText');
      const headerBadge = document.getElementById('headerCountBadge');
      const resetBtn = document.getElementById('resetFilterBtn');

      countText.textContent = `${filteredSpots.length} スポットを表示中`;
      headerBadge.textContent = `${filteredSpots.length}件`;

      const isFiltered = appState.selectedArea !== 'all' || appState.searchQuery.trim() !== '';
      resetBtn.classList.toggle('hidden', !isFiltered);

      listEl.innerHTML = '';

      if (filteredSpots.length === 0) {
        listEl.innerHTML = `
          <div class="py-10 text-center text-xs text-muted bg-paper rounded-xl border border-line">
            条件に一致する建築が見つかりませんでした。
          </div>
        `;
        return;
      }

      filteredSpots.forEach((spot) => {
        const areaInfo = AREAS[spot.area];
        const isSelected = spot.id === appState.selectedSpotId;

        const card = document.createElement('button');
        card.type = 'button';
        card.className = `w-full text-left p-3 rounded-xl border transition flex flex-col gap-1 ${
          isSelected
            ? 'bg-paper border-ink shadow-sm'
            : 'bg-white border-line hover:border-ink/40 hover:bg-paper/50'
        }`;

        card.innerHTML = `
          <div class="flex items-center justify-between gap-2 w-full">
            <span class="inline-flex items-center gap-1.5 text-[10px] font-semibold text-muted">
              <span class="w-2 h-2 rounded-full" style="background-color:${areaInfo.color};"></span>
              <span>${areaInfo.label}</span>
            </span>
            <span class="text-[10px] text-muted truncate max-w-[50%]">${spot.arch}</span>
          </div>
          <div class="text-xs md:text-[13px] font-bold text-ink leading-snug">${spot.id}. ${spot.name}</div>
          <div class="text-[11px] text-muted truncate">${spot.station}</div>
        `;

        card.addEventListener('click', () => {
          selectSpot(spot.id, { pan: true, openDetail: true });
        });

        listEl.appendChild(card);
      });
    }

    /**
     * スポット選択＆【詳細】タブ更新
     */
    function selectSpot(spotId, options = { pan: true, openDetail: true }) {
      const spot = SPOTS.find((s) => s.id === spotId);
      if (!spot) return;

      appState.selectedSpotId = spotId;
      const filtered = getFilteredSpots();
      renderMarkers(filtered);
      renderSpotList(filtered);

      const areaInfo = AREAS[spot.area];

      document.getElementById('detailEmpty').classList.add('hidden');
      document.getElementById('detailCard').classList.remove('hidden');

      const badge = document.getElementById('detailAreaBadge');
      badge.textContent = `${areaInfo.label} #${spot.id}`;
      badge.style.backgroundColor = areaInfo.color;

      document.getElementById('detailName').textContent = spot.name;
      document.getElementById('detailArchitect').textContent = spot.arch;
      document.getElementById('detailStation').textContent = spot.station;
      document.getElementById('detailMemo').textContent = spot.memo;

      // note解説記事リンク
      const noteBtn = document.getElementById('detailNoteBtn');
      noteBtn.href = areaInfo.url;
      document.getElementById('detailNoteBtnText').textContent = `解説記事を読む（${areaInfo.short}）`;

      // Googleマップ電車・バス経路リンク
      const destQuery = encodeURIComponent(`${spot.name} ${spot.lat},${spot.lng}`);
      document.getElementById('detailTransitBtn').href =
        `https://www.google.com/maps/dir/?api=1&destination=${destQuery}&travelmode=transit`;

      // 同じ設計者の建築（竣工年順）
      renderSameArchitectSection(spot);

      if (options.openDetail) {
        switchTab('detail');
      }

      if (options.pan && mapInstance) {
        const targetZoom = Math.max(mapInstance.getZoom(), 14);
        mapInstance.flyTo([spot.lat, spot.lng], targetZoom, { duration: 0.45 });
      }
    }

    /**
     * 同じ設計者の建築（竣工年順）を描画
     */
    function renderSameArchitectSection(currentSpot) {
      const section = document.getElementById('sameArchitectSection');
      const groupsContainer = document.getElementById('sameArchitectGroups');
      groupsContainer.innerHTML = '';

      if (!currentSpot.architects || currentSpot.architects.length === 0) {
        section.classList.add('hidden');
        return;
      }

      let hasAnyGroup = false;

      currentSpot.architects.forEach((archName) => {
        const works = SPOTS
          .filter((s) => s.architects.includes(archName))
          .sort((a, b) => a.year - b.year);

        if (works.length < 2) return;
        hasAnyGroup = true;

        const groupDiv = document.createElement('div');
        groupDiv.className = 'space-y-1.5';

        const heading = document.createElement('div');
        heading.className = 'text-[11px] font-semibold text-muted';
        heading.textContent = `${archName}（${works.length}件）`;
        groupDiv.appendChild(heading);

        works.forEach((w) => {
          const isCurrent = w.id === currentSpot.id;
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = `w-full text-left px-2.5 py-2 rounded-lg text-xs flex items-center justify-between gap-2 border transition ${
            isCurrent
              ? 'bg-ink text-white border-ink font-semibold'
              : 'bg-paper text-ink border-line hover:border-ink/50'
          }`;

          const yearLabel = w.year < 9000 ? `${w.year}` : '—';
          btn.innerHTML = `
            <span class="truncate">${w.name}</span>
            <span class="shrink-0 text-[10px] ${isCurrent ? 'text-white/80' : 'text-muted'}">${AREAS[w.area].short}・${yearLabel}</span>
          `;

          btn.addEventListener('click', () => {
            // 絞り込みで見えない場合は全エリア表示に戻してジャンプ
            if (appState.selectedArea !== 'all' && appState.selectedArea !== w.area) {
              appState.selectedArea = 'all';
              renderAreaChips();
            }
            selectSpot(w.id, { pan: true, openDetail: true });
          });

          groupDiv.appendChild(btn);
        });

        groupsContainer.appendChild(groupDiv);
      });

      section.classList.toggle('hidden', !hasAnyGroup);
    }

    /**
     * 2地点ルート用セレクトボックス初期化
     */
    function populateRouteSelects() {
      const selA = document.getElementById('selectOriginA');
      const selB = document.getElementById('selectDestB');

      const buildOptions = (placeholder) => {
        let html = `<option value="">${placeholder}</option>`;
        Object.values(AREAS).forEach((area) => {
          html += `<optgroup label="${area.label}">`;
          SPOTS.filter((s) => s.area === area.key).forEach((s) => {
            html += `<option value="${s.id}">${s.id}. ${s.name}</option>`;
          });
          html += `</optgroup>`;
        });
        return html;
      };

      selA.innerHTML = buildOptions('出発地 (A) を選択...');
      selB.innerHTML = buildOptions('目的地 (B) を選択...');
    }

    /**
     * 2地点ルートの描画・距離計算・UI更新
     */
    function updateRouteDisplay(shouldFit = true) {
      routeOverlayGroup.clearLayers();

      const selA = document.getElementById('selectOriginA');
      const selB = document.getElementById('selectDestB');
      selA.value = appState.routeA ? String(appState.routeA) : '';
      selB.value = appState.routeB ? String(appState.routeB) : '';

      const spotA = SPOTS.find((s) => s.id === appState.routeA) || null;
      const spotB = SPOTS.find((s) => s.id === appState.routeB) || null;

      // タブの赤いアクティブインジケーター
      document.getElementById('routeActiveDot').classList.toggle('hidden', !(spotA || spotB));

      // A・Bの目立つマーカーを描画
      if (spotA) {
        L.marker([spotA.lat, spotA.lng], {
          zIndexOffset: 900,
          icon: L.divIcon({
            className: '',
            html: '<div class="route-badge-pin route-badge-a">A</div>',
            iconSize: [30, 30],
            iconAnchor: [15, 15],
          }),
        }).addTo(routeOverlayGroup);
      }

      if (spotB) {
        L.marker([spotB.lat, spotB.lng], {
          zIndexOffset: 900,
          icon: L.divIcon({
            className: '',
            html: '<div class="route-badge-pin route-badge-b">B</div>',
            iconSize: [30, 30],
            iconAnchor: [15, 15],
          }),
        }).addTo(routeOverlayGroup);
      }

      const resultBox = document.getElementById('routeResultBox');
      const hintBox = document.getElementById('routeHintBox');

      if (spotA && spotB && spotA.id !== spotB.id) {
        // 白縁＋黒破線の二重ルート線（航空写真でもくっきり）
        const latlngs = [
          [spotA.lat, spotA.lng],
          [spotB.lat, spotB.lng],
        ];
        L.polyline(latlngs, {
          color: '#ffffff',
          weight: 6.5,
          opacity: 0.92,
        }).addTo(routeOverlayGroup);

        L.polyline(latlngs, {
          color: '#161614',
          weight: 3,
          opacity: 0.95,
          dashArray: '7, 7',
        }).addTo(routeOverlayGroup);

        // 距離・所要時間目安計算
        const straightKm = haversineKm(spotA.lat, spotA.lng, spotB.lat, spotB.lng);
        const roadKm = straightKm * 1.25;
        const walkMin = (roadKm / 4.5) * 60;
        const transitMin = (roadKm / 15.0) * 60 + 8;
        const taxiMin = (roadKm / 24.0) * 60 + 2;

        document.getElementById('routeDistText').textContent =
          `${straightKm.toFixed(1)}km / 約${roadKm.toFixed(1)}km`;
        document.getElementById('routeWalkText').textContent = formatDuration(walkMin);
        document.getElementById('routeTransitText').textContent = formatDuration(transitMin);
        document.getElementById('routeTaxiText').textContent = formatDuration(taxiMin);

        const originParam = encodeURIComponent(`${spotA.name} ${spotA.lat},${spotA.lng}`);
        const destParam = encodeURIComponent(`${spotB.name} ${spotB.lat},${spotB.lng}`);
        document.getElementById('btnGoogleRouteAB').href =
          `https://www.google.com/maps/dir/?api=1&origin=${originParam}&destination=${destParam}&travelmode=transit`;

        resultBox.classList.remove('hidden');
        hintBox.classList.add('hidden');

        if (shouldFit && mapInstance) {
          mapInstance.fitBounds(L.latLngBounds(latlngs), { padding: [44, 44], maxZoom: 15 });
        }
      } else {
        resultBox.classList.add('hidden');
        hintBox.classList.remove('hidden');
        if (spotA && spotB && spotA.id === spotB.id) {
          hintBox.textContent = '出発地(A)と目的地(B)には異なるスポットを選択してください。';
        } else {
          hintBox.textContent = '出発地(A)と目的地(B)をそれぞれ選ぶと、地図上にルート線を引き、距離と移動時間の目安を表示します。';
        }
      }
    }

    /**
     * 表示中スポット全体が収まるようズーム調整
     */
    function fitToCurrentSpots(notify = true) {
      const spots = getFilteredSpots();
      if (!spots.length || !mapInstance) return;
      const bounds = L.latLngBounds(spots.map((s) => [s.lat, s.lng]));
      mapInstance.fitBounds(bounds, { padding: [30, 30], maxZoom: 15 });
      if (notify) showToast(`${spots.length}件全体を表示しました`);
    }

    /**
     * 前後のスポットへ移動
     */
    function moveRelativeSpot(delta) {
      const spots = getFilteredSpots();
      if (!spots.length) return;
      const idx = spots.findIndex((s) => s.id === appState.selectedSpotId);
      const nextIdx = idx === -1 ? 0 : (idx + delta + spots.length) % spots.length;
      selectSpot(spots[nextIdx].id, { pan: true, openDetail: true });
    }

    /**
     * 全体再描画
     */
    function refreshView() {
      const filtered = getFilteredSpots();
      renderAreaChips();
      renderMarkers(filtered);
      renderSpotList(filtered);
    }

    /**
     * イベントリスナー登録
     */
    function bindEvents() {
      // タブ切替
      document.querySelectorAll('.tab-btn').forEach((btn) => {
        btn.addEventListener('click', () => switchTab(btn.dataset.tab));
      });

      // キーワード検索
      const searchInput = document.getElementById('searchInput');
      const clearBtn = document.getElementById('clearSearchBtn');
      searchInput.addEventListener('input', (e) => {
        appState.searchQuery = e.target.value;
        clearBtn.classList.toggle('hidden', appState.searchQuery.length === 0);
        refreshView();
      });

      clearBtn.addEventListener('click', () => {
        searchInput.value = '';
        appState.searchQuery = '';
        clearBtn.classList.add('hidden');
        refreshView();
      });

      // 絞り込み解除
      document.getElementById('resetFilterBtn').addEventListener('click', () => {
        appState.selectedArea = 'all';
        appState.searchQuery = '';
        searchInput.value = '';
        clearBtn.classList.add('hidden');
        refreshView();
        fitToCurrentSpots(false);
        showToast('絞り込みを解除しました');
      });

      // 詳細の前後移動
      document.getElementById('btnPrevSpot').addEventListener('click', () => moveRelativeSpot(-1));
      document.getElementById('btnNextSpot').addEventListener('click', () => moveRelativeSpot(1));

      // 詳細からA / Bセット
      document.getElementById('btnSetA').addEventListener('click', () => {
        if (!appState.selectedSpotId) return;
        appState.routeA = appState.selectedSpotId;
        updateRouteDisplay(Boolean(appState.routeA && appState.routeB));
        if (appState.routeA && appState.routeB && appState.routeA !== appState.routeB) {
          switchTab('route');
          showToast('ルートを表示しました');
        } else {
          showToast('出発地 A に設定しました');
        }
      });

      document.getElementById('btnSetB').addEventListener('click', () => {
        if (!appState.selectedSpotId) return;
        appState.routeB = appState.selectedSpotId;
        updateRouteDisplay(Boolean(appState.routeA && appState.routeB));
        if (appState.routeA && appState.routeB && appState.routeA !== appState.routeB) {
          switchTab('route');
          showToast('ルートを表示しました');
        } else {
          showToast('目的地 B に設定しました');
        }
      });

      // 2地点ルートのセレクト変更
      document.getElementById('selectOriginA').addEventListener('change', (e) => {
        appState.routeA = e.target.value ? Number(e.target.value) : null;
        updateRouteDisplay(true);
      });

      document.getElementById('selectDestB').addEventListener('change', (e) => {
        appState.routeB = e.target.value ? Number(e.target.value) : null;
        updateRouteDisplay(true);
      });

      // A⇔B 入れ替え
      document.getElementById('btnSwapAB').addEventListener('click', () => {
        const tmp = appState.routeA;
        appState.routeA = appState.routeB;
        appState.routeB = tmp;
        updateRouteDisplay(true);
        showToast('出発地と目的地を入れ替えました');
      });

      // ルートクリア
      document.getElementById('btnClearRoute').addEventListener('click', () => {
        appState.routeA = null;
        appState.routeB = null;
        updateRouteDisplay(false);
        showToast('ルートをクリアしました');
      });

      // 地図右下の全体表示ボタン
      document.getElementById('btnFitBounds').addEventListener('click', () => fitToCurrentSpots(true));

      // 地図タイル切替メニュー
      const tileMenu = document.getElementById('tileMenu');
      document.getElementById('btnTileMenu').addEventListener('click', (e) => {
        e.stopPropagation();
        tileMenu.classList.toggle('hidden');
      });

      document.querySelectorAll('.tile-opt').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          setMapTile(btn.dataset.tile);
          tileMenu.classList.add('hidden');
          showToast(`${GSI_TILES[btn.dataset.tile].label}に切り替えました`);
        });
      });

      document.addEventListener('click', () => {
        tileMenu.classList.add('hidden');
      });
    }

    // 起動処理
    document.addEventListener('DOMContentLoaded', () => {
      initMap();
      populateRouteSelects();
      bindEvents();
      refreshView();
      fitToCurrentSpots(false);
    });
  </script>
</body>
</html>
